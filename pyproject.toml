[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soccer-analysis"
version = "0.1.0"
description = "Detect, track, and export structured player/ball tracking data from soccer match footage for downstream ML analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Soccer Video Analysis contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "onnxruntime>=1.18",
    "supervision>=0.24",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Torch-backed detector (soccer_analysis.detection.tracker.UltralyticsDetector),
# BoT-SORT tracking (soccer_analysis.detection.botsort_tracker.BoTSORTTracker),
# and training/fine-tuning workflows. Not needed for the default onnxruntime
# runtime path -- see the Modernization notes in the project plan for why
# torch isn't a core dependency here. boxmot (BoT-SORT) imports torch
# unconditionally at import time even in motion-only mode, so it lives here
# too, not as a separate lighter extra.
train = [
    "ultralytics>=8.3",
    "boxmot>=19.0",
]
# scripts/download_assets.py only -- not needed if you supply your own
# model checkpoint and footage.
assets = [
    "gdown>=5.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
soccer-analysis = "soccer_analysis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) as an argument default is the idiomatic Typer pattern,
# not the mutable-default-argument bug B008 warns about.
"src/soccer_analysis/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/soccer_analysis"]
