# Example config for reviewing the soccernet-3 detector + OCR-based jersey
# reading together against real footage, with the video labels visually
# cross-checkable (see draw_ellipse's "12 (3)" jersey/track_id format).
# Adjust the checkpoint path below to whatever's actually under models/
# on this machine -- soccernet-3 happens to be what's there as of writing.
pipeline:
  detection_confidence: 0.1
  detection_batch_size: 20
  detection_imgsz: 960 # matches models/runs/train/soccernet-3's trained resolution
  ball_max_assignment_distance_px: 70.0
  speed_frame_window: 5
  frame_rate: null
  team_kmeans_random_state: 0
  device: null
  frame_filter_mode: "off"
  min_grass_fraction: 0.35
  clock_calibration_path: null
  jersey_backend: "ocr" # needs the [train] extra (pulls in easyocr + torch)
  jersey_min_confidence: 0.5
  jersey_min_votes: 2
