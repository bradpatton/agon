[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agon"
version = "0.1.0"
description = "Detect, track, and export structured player/ball tracking data from soccer match footage for downstream ML analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Agon contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "onnxruntime>=1.18",
    "supervision>=0.24",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Torch-backed detector (agon.detection.tracker.UltralyticsDetector),
# BoT-SORT tracking (agon.detection.botsort_tracker.BoTSORTTracker),
# OCR-based jersey number reading (agon.jersey.ocr_reader.EasyOcrJerseyReader),
# and training/fine-tuning workflows. Not needed for the default onnxruntime
# runtime path -- see the Modernization notes in the project plan for why
# torch isn't a core dependency here. boxmot (BoT-SORT) and easyocr both
# import torch unconditionally at import time, so they live here too, not as
# separate lighter extras.
train = [
    "ultralytics>=8.3",
    "boxmot>=19.0",
    # agon.jersey.ocr_reader.EasyOcrJerseyReader -- see that module's
    # docstring for why OCR replaced the from-scratch-trained classifier.
    "easyocr>=1.7",
    # scripts/train_detector.py's ONNX export step (model.export(format="onnx")).
    # Ultralytics auto-installs these on first use if missing, but that means a
    # mid-training-run pip install requiring internet access on whatever machine
    # is running the training job -- pinning them here so a training image/venv
    # has them from the start instead of surprising a real run.
    "onnx>=1.12",
    "onnxslim>=0.1.82",
    # scripts/download_soccernet_gsr.py (SN-GSR-2025) and
    # scripts/download_soccernet_legacy.py (Tracking/Calibration/Re-ID/
    # Jersey-2023) -- both lazy-import these with a friendly error message,
    # but neither was ever actually declared as a dependency, so a fresh
    # `uv sync --extra train` (e.g. building the Docker image) never
    # installed them and every prepare_training_data.py source failed
    # inside a real container despite working on dev machines that had
    # them installed manually into a throwaway venv.
    "huggingface_hub>=0.24",
    "SoccerNet>=0.1.55",
]
# scripts/download_assets.py only -- not needed if you supply your own
# model checkpoint and footage.
assets = [
    "gdown>=5.1",
]
# agon.broadcast.clock_reader.ClockReader (match-clock OCR, used by
# the frame-filter/game-time-tagging pipeline stage). pytesseract itself is a
# thin wrapper -- it also needs a system Tesseract install not covered by pip
# (macOS: `brew install tesseract`; Debian/Ubuntu: `apt install
# tesseract-ocr`). Not needed for the default pipeline run, which doesn't tag
# game-clock time or filter non-game frames unless configured to.
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
agon = "agon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) as an argument default is the idiomatic Typer pattern,
# not the mutable-default-argument bug B008 warns about.
"src/agon/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agon"]
